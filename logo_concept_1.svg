<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="grad2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="#FFFFFF"/>

  <g transform="translate(600,260)" filter="url(#softShadow)">
    <g transform="rotate(45)">
      <rect x="-110" y="-110" width="220" height="220" rx="44" fill="url(#grad1)"/>
      <rect x="-78" y="-78" width="156" height="156" rx="32" fill="#FFFFFF" fill-opacity="0.06"/>
    </g>
    <g transform="rotate(-15)">
      <rect x="-70" y="-70" width="140" height="140" rx="28" fill="url(#grad2)" opacity="0.9"/>
    </g>
  </g>

  <g text-anchor="middle" fill="#0F172A">
    <text x="600" y="420" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="2">
      NOMBREMARCA
    </text>
    <text x="600" y="468" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="22" fill="#475569">
      Tu slogan aquí
    </text>
  </g>

  <g transform="translate(1020,520)">
    <circle r="6" fill="#22D3EE"/>
    <circle cx="18" r="6" fill="#8B5CF6"/>
    <circle cx="36" r="6" fill="#06B6D4"/>
  </g>
</svg>

