<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    <linearGradient id="strokeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="soft"/>
      <feMerge>
        <feMergeNode in="soft"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <g transform="translate(280,300)" filter="url(#glow)">
    <path d="M-120 0 C -120 -90, 120 -90, 120 0 C 120 90, -120 90, -120 0 Z" fill="#ffffff"/>
    <path d="M-100 0 C -100 -70, 100 -70, 100 0 C 100 70, -100 70, -100 0 Z" stroke="url(#strokeGrad)" stroke-width="16" fill="none"/>
    <circle cx="0" cy="0" r="22" fill="#10B981"/>
    <circle cx="0" cy="0" r="50" stroke="#34D399" stroke-width="2" fill="none" opacity="0.4"/>
  </g>

  <g text-anchor="start" fill="#0B1324">
    <text x="520" y="300" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="1.5">
      NOMBREMARCA
    </text>
    <text x="520" y="348" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="22" fill="#334155">
      Slogan descriptivo y memorable
    </text>
  </g>

  <g transform="translate(1080,520)">
    <rect width="60" height="10" rx="5" fill="#10B981"/>
    <rect y="16" width="60" height="10" rx="5" fill="#14B8A6"/>
  </g>
</svg>

