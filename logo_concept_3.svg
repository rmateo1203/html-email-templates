<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#0E172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#night)"/>

  <g transform="translate(600,260)" filter="url(#shadow)">
    <polygon points="0,-110 95,55 -95,55" fill="#111827"/>
    <polygon points="0,-85 75,45 -75,45" fill="#0F172A"/>
    <circle cx="0" cy="0" r="26" fill="url(#accent)"/>
    <path d="M-6 -6 L 6 6 M 6 -6 L -6 6" stroke="#111827" stroke-width="2" opacity="0.6"/>
  </g>

  <g text-anchor="middle" fill="#E5E7EB">
    <text x="600" y="430" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="2">
      NOMBREMARCA
    </text>
    <text x="600" y="474" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="20" fill="#CBD5E1" letter-spacing="0.5">
      Slogan que inspira acción
    </text>
  </g>

  <g transform="translate(100,520)" opacity="0.8">
    <rect width="200" height="6" rx="3" fill="#F59E0B"/>
    <rect y="14" width="120" height="6" rx="3" fill="#F97316"/>
  </g>
</svg>

